# Publica el juego como PWA en GitHub Pages en cada push a main.
name: Web (GitHub Pages)
on:
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/build-pwa.mjs
      # páginas de privacidad y soporte de la App Store: /privacy/ y /support/
      - run: cp -r store/ios/site/. pwa/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: pwa }
      - id: d
        uses: actions/deploy-pages@v4
