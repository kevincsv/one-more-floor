# Compila One More Floor Escape firmado y lo sube a TestFlight.
# Secrets necesarios (Settings → Secrets and variables → Actions):
#   APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (contenido completo del archivo AuthKey_XXXX.p8)
name: TestFlight (Escape)
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versión visible (ej. 0.1.0)"
        default: "1.0.1"
      build_number:
        description: "Número de build (vacío = número de ejecución)"
        required: false
        default: ""
      runner:
        description: "Mac de GitHub (si uno no tiene hueco, prueba el otro)"
        type: choice
        options: [macos-15, macos-26]
        default: macos-15
      entitlements:
        description: "Firmar con iCloud y Game Center (necesita un dispositivo registrado)"
        type: boolean
        default: true
      placeholder_device:
        description: "Registrar un dispositivo de relleno si no hay ninguno (hace falta para firmar con iCloud/Game Center)"
        type: boolean
        default: false
      store:
        description: "Build de tienda (oculta el menú PRUEBAS)"
        type: boolean
        default: false
env:
  BUNDLE_ID: com.onemorefloor.escape
  APP_NAME: One More Floor Escape
jobs:
  testflight:
    runs-on: ${{ inputs.runner || 'macos-15' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: '26' }
      - run: xcodebuild -version
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - name: Preparar Escape
        run: |
          node -e "const f='capacitor.config.json',c=require('./'+f);c.appId=process.env.BUNDLE_ID;c.appName=process.env.APP_NAME;require('fs').writeFileSync(f,JSON.stringify(c,null,2))"
          OMF_STORE=${{ inputs.store && '1' || '0' }} node scripts/sync-game.mjs game/one-more-floor-escape.html
          # cap add hace pod install con iOS 14 (falla porque OmfNative pide 15); se corrige abajo y cap sync lo repite
          npx cap add ios || echo "pod install se repite tras subir el mínimo a iOS 15"
          test -d ios/App/App.xcodeproj
          # iOS 15 mínimo (Apple lo exige desde abril de 2027)
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 1[34].0;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' ios/App/App.xcodeproj/project.pbxproj
          sed -i '' "s/platform :ios, '1[34].0'/platform :ios, '15.0'/" ios/App/Podfile
          grep -c 'IPHONEOS_DEPLOYMENT_TARGET = 15.0' ios/App/App.xcodeproj/project.pbxproj
          npx cap sync ios
          # Entitlements: Game Center + iCloud key-value
          if [ "${{ inputs.entitlements }}" = "true" ]; then
            cp native/ios/App.entitlements ios/App/App/App.entitlements
            ruby native/ios/add-entitlements.rb ios/App/App.xcodeproj || { sudo gem install xcodeproj --no-document && ruby native/ios/add-entitlements.rb ios/App/App.xcodeproj; }
          else
            echo "Sin entitlements: Game Center e iCloud no funcionarán en esta build"
          fi
          grep -q "OmfNative" ios/App/Podfile && echo "Plugins nativos OmfNative enlazados"
          grep -o '"packageClassList".*' ios/App/App/capacitor.config.json
          # Pantalla de arranque lisa #100e1a (se funde con el splash del juego)
          for f in ios/App/App/Assets.xcassets/Splash.imageset/*.png; do cp pwa-assets/splash-2732.png "$f"; done
          sed -i '' 's/<color key="backgroundColor"[^>]*\/>/<color key="backgroundColor" red="0.0627" green="0.0549" blue="0.102" alpha="1" colorSpace="custom" customColorSpace="sRGB"\/>/g' ios/App/App/Base.lproj/LaunchScreen.storyboard
          # Audio: categoría ambient para que vuelva tras interrupciones y respete el silencio
          python3 - <<'PY'
          p = "ios/App/App/AppDelegate.swift"
          s = open(p).read()
          if "AVAudioSession" not in s:
              s = s.replace("import UIKit", "import UIKit\nimport AVFoundation", 1)
              s = s.replace("launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {",
                            "launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {\n        try? AVAudioSession.sharedInstance().setCategory(.ambient, mode: .default, options: [.mixWithOthers])\n        try? AVAudioSession.sharedInstance().setActive(true)", 1)
              assert "AVAudioSession" in s, "No encontré didFinishLaunching en AppDelegate.swift"
              # Reactivar el audio al volver a primer plano y tras interrupciones (llamadas, Siri...)
              s = s.replace("func applicationDidBecomeActive(_ application: UIApplication) {",
                            "func applicationDidBecomeActive(_ application: UIApplication) {\n        try? AVAudioSession.sharedInstance().setCategory(.ambient, mode: .default, options: [.mixWithOthers])\n        try? AVAudioSession.sharedInstance().setActive(true)", 1)
              s = s.replace("try? AVAudioSession.sharedInstance().setActive(true)\n        // Override point",
                            "try? AVAudioSession.sharedInstance().setActive(true)\n        NotificationCenter.default.addObserver(forName: AVAudioSession.interruptionNotification, object: nil, queue: .main) { n in\n            if let t = n.userInfo?[AVAudioSessionInterruptionTypeKey] as? UInt, t == AVAudioSession.InterruptionType.ended.rawValue {\n                try? AVAudioSession.sharedInstance().setActive(true)\n            }\n        }\n        // Override point", 1)
              assert s.count("setActive(true)") >= 3, "No pude añadir la reactivación de audio"
              open(p, "w").write(s)
          print("AppDelegate con AVAudioSession .ambient")
          PY
          cp pwa-assets/icon-1024.png ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :CADisableMinimumFrameDurationOnPhone bool true" ios/App/App/Info.plist
          plutil -replace CFBundleDisplayName -string "$APP_NAME" ios/App/App/Info.plist
      - name: Clave de App Store Connect
        env: { ASC_KEY_P8: "${{ secrets.ASC_KEY_P8 }}" }
        run: |
          mkdir -p ~/keys
          # Acepta la clave pegada con o sin saltos de línea, con o sin BEGIN/END, o en base64 del archivo.
          python3 - <<'PY'
          import os, re, base64
          raw = os.environ["ASC_KEY_P8"].strip()
          if "BEGIN" not in raw:
              try:
                  dec = base64.b64decode(re.sub(r"\s", "", raw)).decode()
                  if "BEGIN" in dec: raw = dec
              except Exception: pass
          body = re.sub(r"-----(BEGIN|END)[^-]*-----", "", raw)
          body = re.sub(r"[^A-Za-z0-9+/=]", "", body)
          pem = "-----BEGIN PRIVATE KEY-----\n" + "\n".join(body[i:i+64] for i in range(0, len(body), 64)) + "\n-----END PRIVATE KEY-----\n"
          open(os.path.expanduser("~/keys/AuthKey.p8"), "w").write(pem)
          print("Clave normalizada:", len(body), "caracteres en base64")
          PY
          openssl pkey -in ~/keys/AuthKey.p8 -noout && echo "Clave válida"
          echo "AUTH=-allowProvisioningUpdates -authenticationKeyPath $HOME/keys/AuthKey.p8 -authenticationKeyID ${{ secrets.ASC_KEY_ID }} -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }}" >> $GITHUB_ENV
      - name: Apple (capacidades, dispositivo, Game Center)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          REGISTER_PLACEHOLDER_DEVICE: ${{ inputs.placeholder_device && '1' || '0' }}
          NEED_DEVICE: ${{ inputs.entitlements && '1' || '0' }}
        run: |
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography requests || python3 -m pip install --quiet pyjwt cryptography requests
          python3 scripts/asc_gamecenter.py
          # Liberar huecos: revocar certificados de desarrollo que dejó CI en ejecuciones anteriores
          python3 scripts/asc_certs.py --revoke
      - name: Archivar (firmado)
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -archivePath build/App.xcarchive -destination 'generic/platform=iOS' $AUTH \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} CODE_SIGN_STYLE=Automatic $([ "${{ inputs.entitlements }}" = "true" ] || echo CODE_SIGNING_ALLOWED=NO) \
            MARKETING_VERSION=${{ inputs.version }} CURRENT_PROJECT_VERSION=${{ inputs.build_number != '' && inputs.build_number || github.run_number }} archive
      - name: Subir a TestFlight
        timeout-minutes: 35
        run: |
          P=build/ExportOptions.plist; PB=/usr/libexec/PlistBuddy
          $PB -c "Add :method string app-store-connect" $P
          $PB -c "Add :destination string export" $P
          $PB -c "Add :teamID string ${{ secrets.APPLE_TEAM_ID }}" $P
          $PB -c "Add :signingStyle string automatic" $P
          $PB -c "Add :manageAppVersionAndBuildNumber bool false" $P
          xcodebuild -exportArchive -archivePath build/App.xcarchive -exportPath build \
            -exportOptionsPlist build/ExportOptions.plist $AUTH
          ls -la build/*.ipa
          # Comprobar que la app firmada lleva los entitlements de iCloud y Game Center
          rm -rf build/check && mkdir -p build/check && unzip -q build/App.ipa -d build/check
          codesign -d --entitlements :- build/check/Payload/App.app 2>/dev/null | tee build/entitlements.plist | grep -E "ubiquity-kvstore|game-center|aps-environment|application-identifier" -A1 || true
          if [ "${{ inputs.entitlements }}" = "true" ] && ! grep -q "ubiquity-kvstore-identifier" build/entitlements.plist; then
            echo "::error::La app firmada no lleva el entitlement de iCloud key-value"; exit 1
          fi
          # Subida con altool y reintentos (la subida directa de Apple a veces se queda colgada)
          mkdir -p ~/.appstoreconnect/private_keys
          cp ~/keys/AuthKey.p8 ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
          for i in 1 2 3; do
            if xcrun altool --upload-app -f build/App.ipa -t ios \
                 --apiKey ${{ secrets.ASC_KEY_ID }} --apiIssuer ${{ secrets.ASC_ISSUER_ID }}; then
              echo "Subida OK"; exit 0
            fi
            echo "Intento $i falló; reintento en 60 s"; sleep 60
          done
          exit 1
      - name: Revocar el certificado de desarrollo de esta ejecución
        if: always()
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: python3 scripts/asc_certs.py --revoke || true
      - if: always()
        run: rm -f ~/keys/AuthKey.p8 ~/.appstoreconnect/private_keys/*.p8
