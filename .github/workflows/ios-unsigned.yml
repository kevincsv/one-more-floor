# Compila un IPA sin firmar en un Mac de GitHub (gratis en repos públicos; minutos limitados en privados).
# Después se firma e instala desde Windows con Sideloadly usando tu Apple ID gratis.
name: iOS IPA (sin firmar)
on:
  workflow_dispatch:
permissions: { contents: write }
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: node scripts/sync-game.mjs
      - run: npx cap add ios
      - run: npx cap sync ios
      - name: Compilar sin firma
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload && cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr OneMoreFloor-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: OneMoreFloor-unsigned-ipa, path: OneMoreFloor-unsigned.ipa }
      - name: Publicar en la release "latest"
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Última versión (IPA sin firmar)
          prerelease: true
          make_latest: false
          files: OneMoreFloor-unsigned.ipa
