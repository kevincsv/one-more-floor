# Solo ajusta App Store Connect (capacidades, Game Center, compra Escape completo) sin compilar.
name: Apple setup (sin build)
on:
  workflow_dispatch:
jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Clave
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/keys
          python3 - <<'PY'
          import os, re, base64
          raw = os.environ["ASC_KEY_P8"].strip()
          if "BEGIN" not in raw:
              try:
                  dec = base64.b64decode(re.sub(r"\s", "", raw)).decode()
                  if "BEGIN" in dec: raw = dec
              except Exception: pass
          body = re.sub(r"-----(BEGIN|END)[^-]*-----", "", raw)
          body = re.sub(r"[^A-Za-z0-9+/=]", "", body)
          pem = "-----BEGIN PRIVATE KEY-----\n" + "\n".join(body[i:i+64] for i in range(0, len(body), 64)) + "\n-----END PRIVATE KEY-----\n"
          open(os.path.expanduser("~/keys/AuthKey.p8"), "w").write(pem)
          PY
      - name: App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          NEED_DEVICE: "0"
          REGISTER_PLACEHOLDER_DEVICE: "0"
        run: |
          python3 -m pip install --quiet pyjwt cryptography requests
          python3 scripts/asc_gamecenter.py
      - if: always()
        run: rm -rf ~/keys
