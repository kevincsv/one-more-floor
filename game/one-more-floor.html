<script>
(() => {
"use strict";
const TS = 24, H = 22, CW = 960, CH = 528;
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const dk = document.createElement("canvas"); dk.width = CW; dk.height = CH; const dctx = dk.getContext("2d");

/* ---------- data ---------- */
const CATS = { mov: "Movimiento", com: "Combate", per: "Percepción", ent: "Entorno", tie: "Tiempo" };
const RULES = [
  { id: "nojump", cat: "mov", name: "Sin salto", icon: "⤓", cost: 2, desc: "No puedes saltar. Aparecen escaleras y los pinchos suben y bajan." },
  { id: "invis", cat: "per", name: "Enemigos invisibles", icon: "?", cost: 3, desc: "No ves a los enemigos. Se delatan por el polvo y al recibir golpes." },

  { id: "noise", cat: "per", name: "Ruido", icon: "♪", cost: 1, desc: "Saltar, aterrizar y atacar hacen ruido y atraen enemigos." },
  { id: "inertia", cat: "mov", name: "Inercia", icon: "»", cost: 3, desc: "Siempre corres. Puedes girar, pero nunca parar." },
  { id: "gold", cat: "tie", name: "Oro maldito", icon: "¤", cost: 1, desc: "Cada moneda que llevas te frena. Se guarda al llegar a la salida." },
  { id: "frozen", cat: "mov", name: "Inmóvil", icon: "⌖", cost: 3, desc: "No puedes caminar ni saltar. Arrastra y suelta para lanzarte como con una honda." },
  { id: "mirror", cat: "mov", name: "Espejo", icon: "\u21C4", cost: 2, desc: "Izquierda y derecha están invertidas, también al apuntar." },
  { id: "echo", cat: "ent", name: "Eco", icon: "\u25CC", cost: 3, desc: "Un fantasma repite tus movimientos de hace 3 s y hace daño al tocarte." },
  { id: "hot", cat: "tie", name: "Suelo ardiente", icon: "\u2668", cost: 2, desc: "Si te quedas quieto en el suelo más de 2 s, te quemas." },
  { id: "shrink", cat: "mov", name: "Diminuto", icon: "\u2022", cost: 1, desc: "Eres pequeño: es más fácil esquivar, pero saltas menos." },
  { id: "magnet", cat: "ent", name: "Magnetismo", icon: "\u2229", cost: 2, desc: "Las monedas y los enemigos cercanos son atraídos hacia ti." },
  { id: "clone", cat: "com", name: "División", icon: "\u2702", cost: 2, desc: "Al vencer a un enemigo, se divide en dos más pequeños." },
  { id: "bouncy", cat: "mov", name: "Rebote", icon: "\u2195", cost: 2, desc: "Todas las superficies son camas elásticas." },
  { id: "slow", cat: "tie", name: "Cámara lenta", icon: "\u25F7", cost: 1, desc: "Todo va a mitad de velocidad menos tú." },
  { id: "swap", cat: "ent", name: "Intercambio", icon: "\u21CB", cost: 3, desc: "Cada 7 s cambias de sitio con un enemigo al azar. Avisa 1 s antes." },
  { id: "wind", cat: "ent", name: "Viento", icon: "\u224B", cost: 2, desc: "Una ráfaga te empuja hacia un lado y cambia de dirección cada 6 s." },
];
const RULE = Object.fromEntries(RULES.map(r => [r.id, r]));
const START_DECK = ["nojump", "invis", "grav", "noatk", "dark", "ice"];
const COMBOS = [
  { a: "nojump", b: "grav", name: "Péndulo", desc: "Sin saltar, la gravedad es tu forma de subir." },
  { a: "ice", b: "noatk", name: "Billar", desc: "Un enemigo empujado derriba a los que golpea." },
  { a: "dark", b: "noise", name: "Caza", desc: "Tu ruido ilumina a los enemigos cercanos." },
  { a: "onehit", b: "timer", name: "Duelo", desc: "Cada enemigo vencido da +5 s." },
  { a: "invis", b: "noatk", name: "Escondite", desc: "Empujar lo que no ves." },
  { a: "grav", b: "invis", name: "Vértigo", desc: "Arriba, abajo y nadie a la vista." },
  { a: "frozen", b: "grav", name: "Satélite", desc: "Lánzate y deja que la gravedad te devuelva." },
  { a: "inertia", b: "onehit", name: "Kamikaze", desc: "Sin frenos y sin margen." },
  { a: "tide", b: "dark", name: "Abismo", desc: "Agua negra que sube." },
  { a: "gold", b: "timer", name: "Codicia", desc: "Cada moneda te frena y el reloj no espera." },
  { a: "dark", b: "invis", name: "Pesadilla", desc: "No ves nada y lo que acecha tampoco se ve." },
  { a: "ice", b: "nojump", name: "Patinaje", desc: "Deslizarte es la única forma de cruzar." },
  { a: "echo", b: "mirror", name: "Reflejo", desc: "Tus controles invertidos y tu pasado persiguiéndote." },
  { a: "wind", b: "bouncy", name: "Globo", desc: "Cada rebote te lleva donde quiera el viento." },
  { a: "magnet", b: "clone", name: "Enjambre", desc: "Cada enemigo que vences atrae a dos más." },
];
const RELICS = [
  { id: "linterna", name: "Linterna", desc: "Ves mucho más lejos en la Oscuridad.", price: 20 },
  { id: "iman", name: "Botas de imán", desc: "La gravedad cambia cada 12 s y avisa 2 s antes.", price: 20 },
  { id: "pacifista", name: "Pacifista", desc: "Con Sin atacar, tus empujones hacen 1 de daño.", price: 25 },
  { id: "corazon", name: "Corazón extra", desc: "+1 de vida máxima.", price: 30 },
  { id: "buho", name: "Ojo de búho", desc: "Ves enemigos invisibles a 3 casillas.", price: 20 },
  { id: "escudo", name: "Escudo de bronce", desc: "Bloquea el primer golpe de cada piso.", price: 30 },
  { id: "bolsa", name: "Bolsa de cuero", desc: "El Oro maldito pesa la mitad y ganas +25% de oro.", price: 20 },
  { id: "branquias", name: "Branquias", desc: "Aguantas la respiración el triple.", price: 15 },
  { id: "reloj", name: "Reloj de arena", desc: "Contrarreloj empieza con +20 s.", price: 15 },
  { id: "muelle", name: "Muelle", desc: "La honda es más fuerte y puedes lanzarte una vez en el aire.", price: 25 },
  { id: "crampones", name: "Crampones", desc: "Te agarras mucho mejor sobre el Hielo.", price: 15 },
];
const RELIC = Object.fromEntries(RELICS.map(r => [r.id, r]));
const CHARS = [
  { id: "kai", name: "Kai", desc: "Equilibrado. 3 corazones.", hp: 3, speed: 1, push: 1, see: 0, color: "#f2c14e", dark: "#b8862a" },
  { id: "nyx", name: "Nyx", desc: "Ve enemigos invisibles a 3 casillas y ve más en la Oscuridad. 2 corazones.", hp: 2, speed: 1.05, push: 1, see: 3, color: "#b9a7ff", dark: "#7a68c4", unlock: "Llega al piso 5" },
  { id: "rolo", name: "Rolo", desc: "Empuja mucho más fuerte. 4 corazones, algo más lento.", hp: 4, speed: .9, push: 1.6, see: 0, color: "#ff9a5a", dark: "#b8602e", unlock: "Vence a un jefe" },
];

/* ---------- meta (saved per browser) ---------- */
const META_KEY = "omf-meta-v2";
let META = { unlocked: START_DECK.slice(), survive: {}, combos: [], best: 0, chars: ["kai"], daily: {} };
try { const m = JSON.parse(localStorage.getItem(META_KEY) || "null"); if (m && m.unlocked) META = Object.assign(META, m); } catch (_) {}
function saveMeta() { try { localStorage.setItem(META_KEY, JSON.stringify(META)); } catch (_) {} }

/* ---------- rng ---------- */
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rnd = (a, b) => a + Math.random() * (b - a);
const rri = (R, a, b) => a + Math.floor(R() * (b - a + 1));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function todayKey() { const d = new Date(); return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate(); }

/* ---------- state ---------- */
let S;
const input = { left: false, right: false, jump: false, attack: false, down: false, up: false };
let aimAt = null;
const pressed = { jump: false, attack: false };
const has = id => S.rules.includes(id);
const rel = id => S.relics.includes(id);
const cap = f => Math.min(5, 1 + Math.floor((f - 1) / 3));
const isBoss = f => f % 5 === 0;
let forceVert = false, forceClimb = false;
const diff = () => 1 + 0.03 * (S.floor - 1);

function newRun(opts = {}) {
  const ch = CHARS.find(c => c.id === (opts.char || (S && S.char && S.char.id) || "kai")) || CHARS[0];
  const daily = !!opts.daily;
  const seed = daily ? todayKey() : (Math.random() * 1e9) | 0;
  S = { floor: 1, coins: 0, carry: 0, rules: [], relics: [], char: ch, maxhp: ch.hp, hp: ch.hp, mode: "title", t: 0, mult: 1,
    seed, daily, rng: mulberry(seed), toasts: [], won: false };
  if (daily) {
    const R = mulberry(seed + 7), seq = RULES.map(r => r.id);
    for (let i = seq.length - 1; i > 0; i--) { const j = Math.floor(R() * (i + 1)); [seq[i], seq[j]] = [seq[j], seq[i]]; }
    S.dailySeq = seq;
  }
}

/* ---------- level generation ---------- */
const CHUNK_DIFF = { flat: 0, secret: 0.5, step: 1, mesa: 1, tunnel: 1.5, spring: 1.5, elevator: 1.5, ceil: 2, conveyor: 2, stalactite: 2, pit: 2, trap: 2.5, bridge: 2.5, arena: 3, mover: 3, crumble: 3, troll: 3.5, blink: 3.5, chasm: 4 };
function buildFloor() {
  const R = S.rng, f = S.floor, boss = isBoss(f), nj = has("nojump");
  const vroll = R();
  const vroll2 = R();
  if (!boss && (forceVert || (has("grav") && vroll < 0.35))) { buildVertical(true); return; }
  if (!boss && (forceClimb || vroll2 < 0.45)) { buildVertical(false); return; }
  S.vertical = false; S.rising = false; S.LH = H; S.camY = 0;
  const LW = boss ? 44 : Math.min(120, 52 + f * 4), JR = has("shrink") ? 2 : 3;
  const hgt = new Array(LW).fill(3);
  const spikes = [], ladders = [], plats = [], movers = [], springs = [], conveyors = [], drops = [], torches = [], extraEnemies = [];
  let chestAt = -1, curType = "", curStart = 0;
  const chunks = [], coinsAt = [], upperEnemies = [], secretBg = [], ceilH = new Array(LW).fill(1);
  const addSpike = (tx, ty, ceil, ph) => spikes.push({ tx, ty, ceil: !!ceil, phase: ph });
  let ph = 0;
  if (!boss) {
    let x = 8, cur = 3;
    const flat = (w, h) => { for (let k = 0; k < w && x + k < LW; k++) hgt[x + k] = h; };
    let last = "";
    while (x < LW - 16) {
      const wts = [["flat", 2.5], ["step", 2.5], ["pit", 1.6 + f * 0.1], ["bridge", nj ? 0 : 1.1], ["ceil", 0.9],
        ["mover", 2], ["elevator", 1.3], ["spring", 1.2], ["conveyor", 1], ["stalactite", f >= 2 ? 1 : 0.3],
        ["crumble", f >= 2 ? 1.5 : 0.4], ["troll", f >= 2 ? 1.1 : 0], ["blink", f >= 3 ? 1.2 : 0], ["trap", f >= 2 ? 1 : 0], ["arena", 0.6],
        ["chasm", f >= 2 && !nj ? 1.4 : 0], ["tunnel", 1.3], ["secret", 0.5], ["mesa", 1.3]];
      // rhythm: three waves of rising intensity per floor, each followed by a breather
      const wave = (((x - 8) / Math.max(1, LW - 24)) * 3) % 1;
      const target = wave < 0.15 ? 0 : Math.min(1.2, f * 0.1) + wave * (2.2 + Math.min(1.2, f * 0.1));
      for (const w of wts) w[1] *= Math.exp(-(((CHUNK_DIFF[w[0]] ?? 2) - target) ** 2) / 3);
      let tot = 0; for (const w of wts) if (w[0] !== last) tot += w[1];
      let r = R() * tot, t = "flat";
      for (const [n, w] of wts) { if (n === last) continue; if ((r -= w) < 0) { t = n; break; } }
      last = t;
      if (curType) chunks.push([curStart, x, curType]); curStart = x; curType = t;
      const top = () => H - cur; // first solid row of the current ground
      const pitWith = (w, spiked) => { flat(w, 1); ph += 0.7; if (spiked) for (let k = 0; k < w; k++) addSpike(x + k, H - 2, false, ph); for (let y = H - cur - 1; y <= H - 2; y++) ladders.push([x + w - 1, y]); };
      if (t === "flat" || t === "arena") {
        const w = t === "arena" ? rri(R, 10, 14) : rri(R, 4, 8); flat(w, cur);
        if (t === "arena") { for (let k = 0; k < 2 + Math.floor(f / 3); k++) extraEnemies.push(x + rri(R, 2, w - 2)); if (R() < 0.5) chestAt = x + Math.floor(w / 2); }
        else if (R() < 0.45 + f * 0.03) { const sx = x + rri(R, 1, Math.max(1, w - 3)), sw = rri(R, 1, 2); ph += 0.7; for (let k = 0; k < sw; k++) addSpike(sx + k, H - cur - 1, false, ph); }
        if (R() < 0.35) torches.push([x + rri(R, 1, w - 1), H - cur - 4]);
        x += w;
      } else if (t === "step") {
        const w = rri(R, 3, 6); let nc = clamp(cur + rri(R, -3, 3), 2, 12); if (nc === cur) nc = cur < 12 ? cur + 2 : cur - 2;

  if (S.spawnQ.length) { S.enemies.push(...S.spawnQ); S.spawnQ = []; }

  // coins
  for (const c of S.coinsL) {

    if (c.vy !== undefined) { c.vy += 900 * S.gdir * dt; c.y += c.vy * dt; c.x += (c.vx || 0) * dt; c.vx *= 0.97; if (solid(c.x + 5, c.y + c.h) && c.vy > 0) { c.vy = 0; c.vx = 0; c.y = Math.floor((c.y + c.h) / TS) * TS - c.h; } if (solid(c.x + 5, c.y) && c.vy < 0) { c.vy = 0; c.vx = 0; c.y = Math.floor(c.y / TS + 1) * TS; } }

  }
  S.coinsL = S.coinsL.filter(c => !c.taken);
  for (const it of S.items || []) {
    if (it.taken || !overlap({ x: p.x - 8, y: p.y - 8, w: p.w + 16, h: p.h + 16 }, it)) continue;
    it.taken = true;
    if (it.kind === "heart") { if (S.hp < S.maxhp) { S.hp++; toast("+1 corazón"); } else { S.maxhp++; S.hp++; toast("Corazón máximo +1"); } burst(it.x + 7, it.y + 7, "#e0566b", 14); }
    else { const pool = RELICS.filter(r => !rel(r.id)); if (pool.length) { const r = pool[Math.floor(Math.random() * pool.length)]; gainRelic(r.id); toast("Reliquia oculta: " + r.name); } else { addGold(15); toast("+15 de oro"); } burst(it.x + 7, it.y + 7, "#5fd1c4", 14); }
  }
  if (S.chest && !S.chest.open && overlap(p, S.chest)) {
    S.chest.open = true;
    const pool = RELICS.filter(r => !rel(r.id));
    if (pool.length) { const r = pool[Math.floor(Math.random() * pool.length)]; gainRelic(r.id); toast("Reliquia: " + r.name); }
    else { addGold(10); toast("Cofre: +10 de oro"); }

  }

  for (const sh of S.shots) {
    sh.life -= dt;
    if (sh.g) sh.vy += 700 * S.gdir * dt;
    sh.x += sh.vx * dt; sh.y += sh.vy * dt;
    const hitWall = solid(sh.x, sh.y);
    if (sh.kind === "bomb" && (hitWall || overlap(p, { x: sh.x - 6, y: sh.y - 6, w: 12, h: 12 }))) {
      sh.life = 0; burst(sh.x, sh.y, "#ff9a3a", 18);
      if (Math.hypot(p.x + p.w / 2 - sh.x, p.y + p.h / 2 - sh.y) < 46) hurt(Math.sign(p.x - sh.x) || 1);
      for (const e of S.enemies) if (!e.dead && !e.boss && Math.hypot(e.x + e.w / 2 - sh.x, e.y + e.h / 2 - sh.y) < 40) damage(e, 1, "spike");
    } else if (sh.kind === "arrow") {

      else if (overlap(p, { x: sh.x - 3, y: sh.y - 3, w: 6, h: 6 })) { sh.life = 0; hurt(Math.sign(sh.vx) || 1); }
      else if (p.atk > 0 && Math.hypot(p.x + p.w / 2 - sh.x, p.y + p.h / 2 - sh.y) < 40) { sh.vx *= -1.2; sh.vy *= -1.2; sh.kind = "reflected"; }
    } else if (sh.kind === "reflected") {
      if (hitWall) sh.life = 0;
      for (const e of S.enemies) if (!e.dead && overlap(e, { x: sh.x - 3, y: sh.y - 3, w: 6, h: 6 })) { damage(e, e.boss ? 2 : 99, "hit"); sh.life = 0; break; }
    }
  }
  S.shots = S.shots.filter(sh => sh.life > 0);
  for (const q of S.parts) { q.x += q.vx * dt; q.y += q.vy * dt; q.vy += (q.g || 0) * dt; q.life -= dt; }
  S.parts = S.parts.filter(q => q.life > 0);
  for (const r of S.rings) { r.r += 420 * dt; } S.rings = S.rings.filter(r => r.r < r.max);

  if (S.vertical) {
    if (S.rising) {
      if (S.banner <= 0 && !S.inRoom) S.camY = Math.max(0, S.camY - S.rise * dt);
      if (!S.inRoom && p.y > S.camY + CH + 6) { toast("Te alcanzó el fondo"); S.hp = 0; die(); return; }
      if (p.y + p.h < S.camY - 6) { toast("Te adelantaste demasiado"); S.hp = 0; die(); return; }
    } else S.camY = clamp(p.y + p.h / 2 - CH / 2, 0, S.LH * TS - CH);
    if (p.y < S.exitY) { finishFloor(); return; }
    updateHud(); return;
  }
  const bossAlive = S.enemies.some(e => e.boss && !e.dead);
  if (bossAlive && p.x + p.w > S.exitX - 2) { p.x = S.exitX - 2 - p.w; p.vx = Math.min(0, p.vx); }
  if (!bossAlive && p.x + p.w > S.exitX + 4) { finishFloor(); return; }
  S.camX = clamp(p.x + p.w / 2 - CW / 2, 0, S.LW * TS - CW);
  updateHud();
}

function shoot(x, y, tx, ty, speed, kind) {
  const a = Math.atan2(ty - y, tx - x);
  S.shots.push({ x, y, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed, kind, life: 4 });
}
function updateEnemy(e, dt, p) {
  const d = e.spd, dx = (p.x + p.w / 2) - (e.x + e.w / 2), dy = (p.y + p.h / 2) - (e.y + e.h / 2);

    e.x += e.vx * dt; e.y += e.vy * dt + Math.sin(S.t * 4 + e.ph) * 0.4;
    if (Math.random() < dt * 12) S.parts.push({ x: e.x + 8, y: e.y + 8, vx: rnd(-10, 10), vy: rnd(-20, 0), life: 0.5, c: "rgba(140,240,255,.6)", s: 3 });

    e.cd -= dt;
    if (e.cd <= 0 && Math.abs(dx) < 30 && dy * S.gdir > 0) { e.cd = 2.2; S.shots.push({ x: e.x + 11, y: e.y + 14, vx: e.vx * 0.3, vy: 60 * S.gdir, kind: "bomb", life: 4, g: true }); }
    return;
  }
  if (e.type === "spider") {
    e.ai -= dt;
    const floorAhead = () => solid(e.x + e.w / 2, S.gdir > 0 ? e.y + e.h + 2 : e.y - 2);
    if (e.st === "hang") { e.y = e.anchor + Math.sin(S.t * 2 + e.ph) * 4; if (Math.abs(dx) < 1.6 * TS && dy > 0) { e.st = "drop"; } }

    else if (e.st === "wait") { if (e.ai <= 0) e.st = "climb"; }
    else { e.y -= 90 * dt; if (e.y <= e.anchor) { e.y = e.anchor; e.st = "hang"; } }

    return;
  }

    e.face = Math.sign(dx) || 1; e.cd -= dt;
    if (e.tele > 0) { e.tele -= dt; e.flash = 0.2; if (e.tele <= 0) { shoot(e.x + e.w / 2, e.y + 8, p.x + p.w / 2, p.y + p.h / 2, 250 * Math.min(1.3, d), "arrow"); e.cd = rnd(2.2, 3.2) / d; } }

    if (e.st === "walk" && e.ground && !solid(e.dir > 0 ? e.x + e.w + 2 : e.x - 2, S.gdir > 0 ? e.y + e.h + 4 : e.y - 4)) e.dir *= -1;
    return;
  }
  if (e.type === "knight") {

      else { e.vx = e.dir * 220 * d; if (e.ai <= 0 || e.hitWall) { e.st = "walk"; e.ai = rnd(1.8, 2.8); } }

function hitEnemy(e, ang) {
  if (e.type === "knight" && !has("noatk") && e.stun <= 0) {
    const p = S.player, fromFront = Math.sign(p.x + p.w / 2 - (e.x + e.w / 2)) === e.face, fromAbove = Math.sin(ang) * S.gdir > 0.55;
    if (fromFront && !fromAbove) {
      burst(e.x + e.w / 2 + e.face * 12, e.y + 10, "#c9cde0", 8);
      p.vx = e.face * 260; p.launchT = 0.15; e.vx = -e.face * 60; e.stun = 0.15;
      if (!S.knightTip) { S.knightTip = true; toast("El escudo bloquea: golpéalo por detrás o desde arriba"); }
      return;
    }
  }
  e.flash = 0.5;
  const c = Math.cos(ang), sn = Math.sin(ang), lift = e.type === "bat" ? 0 : -140 * S.gdir;
  if (has("noatk")) {
    let k = 450 * S.char.push; if (e.boss) k *= 0.45;
    e.vx = c * k; e.vy = sn * k + lift; e.stun = 0.75;
    if (rel("pacifista")) damage(e, 1, "hit");
  } else {
    damage(e, has("onehit") ? (e.boss ? 4 : 99) : 1, "hit");
    if (!e.dead) { const k = (e.boss ? 150 : 340) * S.char.push; e.vx = c * k; e.vy = sn * k + lift * 0.6; e.stun = e.boss ? 0.2 : 0.5; }
  }
}
function damage(e, n, src) {
  if (e.dead) return;

  e.hp -= n; e.flash = 0.5;
  if (e.hp <= 0) kill(e, src);
}
function kill(e, src) {
  e.dead = true;
  if (has("clone") && !e.boss && !e.small) {
    for (const sgn of [-1, 1]) {
      const c = mkEnemy(e.type, e.x + e.w / 4, e.y + e.h / 4);
      c.w = Math.round(e.w * 0.65); c.h = Math.round(e.h * 0.65); c.hp = 1; c.small = true;
      c.vx = sgn * 160; c.vy = -220 * S.gdir; c.stun = 0.5; c.flash = 0.4; S.spawnQ.push(c);
    }
  }
  const v = e.boss ? 25 : src === "spike" ? 3 : 2;
  for (let i = 0; i < Math.min(v, 8); i++) S.coinsL.push({ x: e.x + e.w / 2, y: e.y, w: 10, h: 12, v: Math.ceil(v / Math.min(v, 8)), vx: rnd(-120, 120), vy: rnd(-300, -150) * S.gdir });

  burst(e.x + e.w / 2, e.y + e.h / 2, src === "spike" ? "#f2c14e" : "#e0566b", e.boss ? 40 : 14);

}
function hurt(dir, drown) {
  const p = S.player;

  if (rel("escudo") && !S.shieldUsed) { S.shieldUsed = true; p.inv = 1; toast("Escudo de bronce"); burst(p.x + 8, p.y + 11, "#c9a36a", 10); return; }
  if (has("onehit") && !S.shieldOneHit) { S.shieldOneHit = true; p.inv = 1; toast("Escudo del piso gastado"); burst(p.x + 8, p.y + 11, "#5fd1c4", 10); return; }
  S.hp = has("onehit") ? 0 : S.hp - 1; p.inv = 1.1;

function die() { S.mode = "dead"; endRunMeta(); showDead(); }
function addGold(n) { S.coins += Math.round(n * S.mult * (rel("bolsa") ? 1.25 : 1)); }
function gainRelic(id) { if (!rel(id)) S.relics.push(id); if (id === "corazon") { S.maxhp++; S.hp++; } }

function puffC(x, y, c, n) { for (let i = 0; i < n; i++) S.parts.push({ x, y, vx: rnd(-50, 50), vy: rnd(-60, 0), life: rnd(.3, .5), c, s: 3 }); }
function burst(x, y, c, n) { for (let i = 0; i < n; i++) S.parts.push({ x, y, vx: rnd(-180, 180), vy: rnd(-200, 120), g: 500 * S.gdir, life: rnd(.4, .8), c, s: 4 }); }

/* ---------- flow ---------- */
function finishFloor() {
  const was = S.floor;
  if (S.carry) { addGold(S.carry); S.carry = 0; }
  addGold(5);
  // meta: surviving rules unlocks new ones
  for (const id of S.rules) {
    META.survive[id] = (META.survive[id] || 0) + 1;
    if (META.survive[id] === 3) { const nx = RULES.find(r => !META.unlocked.includes(r.id)); if (nx) { META.unlocked.push(nx.id); toast("Nueva regla en el mazo: " + nx.name); } }
  }
  META.best = Math.max(META.best, was + 1);
  if (was + 1 >= 5 && !META.chars.includes("nyx")) { META.chars.push("nyx"); toast("Personaje desbloqueado: Nyx"); }
  if (S.daily) { const k = String(S.seed); META.daily[k] = Math.max(META.daily[k] || 0, was + 1); }
  saveMeta();
  S.floor++; S.hp = Math.min(S.maxhp, S.hp + 1); S.mult = 1;
  if (was === 15 && !S.won) { S.won = true; S.mode = "menu"; showVictory(); return; }
  if (isBoss(was)) { S.mode = "menu"; showShop(); return; }
  nextRuleStep();
}
function nextRuleStep() {
  if (S.daily) { applyRule(S.dailySeq[(S.floor - 1) % S.dailySeq.length]); startFloor(); return; }
  S.mode = "menu"; showCards();
}
const comboPair = (a, b) => COMBOS.some(c => (c.a === a && c.b === b) || (c.a === b && c.b === a));
function applyRule(id) {
  const cat = RULE[id].cat;
  S.rules = S.rules.filter(r => r !== id && (RULE[r].cat !== cat || comboPair(r, id)));
  while (S.rules.length >= cap(S.floor)) S.rules.shift();
  S.rules.push(id);
}
function startFloor() {
  // rebuild the rare floor the repair pass could not connect
  for (let tries = 0; tries < 4; tries++) { buildFloor(); analyzeFloor(); if (S.graph.ok) break; }
  S.mode = "play"; ov.hidden = true;
  for (const c of activeCombos()) if (!META.combos.includes(c.name)) { META.combos.push(c.name); saveMeta(); toast("Combinación descubierta: " + c.name); }
  lastHud = ""; updateHud(); buildLab();
}
function activeCombos() { return COMBOS.filter(c => has(c.a) && has(c.b)); }
function endRunMeta() { META.best = Math.max(META.best, S.floor); saveMeta(); }

function showCards() {
  ov.hidden = false;
  const pool = META.unlocked.filter(id => !has(id)).map(id => RULE[id]);
  for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
  const pick = [];
  for (const r of pool) { if (pick.length === 2) break; if (!pick.length || pick[0].cat !== r.cat || pool.length < 3) pick.push(r); }
  if (!pick.length) { startFloor(); return; }
  const hard = pick.length === 2 && pick[0].cost !== pick[1].cost ? (pick[0].cost > pick[1].cost ? 0 : 1) : -1;
  const c = cap(S.floor);
  const replaces = r => { const same = S.rules.find(x => RULE[x].cat === r.cat && !comboPair(x, r.id)); if (same) return RULE[same].name; if (S.rules.length >= c) return RULE[S.rules[0]].name; return null; };
  ov.innerHTML = `<h2>PISO ${S.floor}${isBoss(S.floor) ? " · JEFE" : ""}: ELIGE LA REGLA</h2>
    <p>Reglas a la vez en este piso: hasta ${c}. Solo una por categoría, salvo las combinaciones con nombre.</p>
    <div class="cards">${pick.map((r, i) => { const rep = replaces(r); return `<button class="card" data-i="${i}">
      <span class="ic">${r.icon}</span><span class="nm">${r.name}</span><span class="tag">${CATS[r.cat]}</span><span class="ds">${r.desc}</span>
      ${i === hard ? '<span class="rw">Más difícil: +50% de oro</span>' : ""}
      ${rep ? `<span class="rp">Reemplaza a ${rep}</span>` : ""}
      <span class="tag">Tecla ${i + 1}</span></button>`; }).join("")}</div>`;
  ov.querySelectorAll(".card").forEach(b => b.onclick = () => choose(pick, +b.dataset.i, hard));
  S.cardPick = { pick, hard };
}
function choose(pick, i, hard) { S.cardPick = null; S.mult = i === hard ? 1.5 : 1; applyRule(pick[i].id); startFloor(); }
function showShop() {
  ov.hidden = false;
  const pool = RELICS.filter(r => !rel(r.id));
  for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
  const offer = pool.slice(0, 3);
  let removed = false;
  const render = () => {
    ov.innerHTML = `<h2>TIENDA DEL JEFE</h2>
      <p>Tienes ${S.coins} de oro. Puedes comprar reliquias y borrar una regla gratis antes de seguir.</p>
      <div class="cards">${offer.map((r, i) => `<button class="card" data-r="${i}" ${r.sold || S.coins < r.price ? "disabled" : ""}>
        <span class="nm">${r.name}</span><span class="ds">${r.desc}</span><span class="rw">${r.sold ? "Comprada" : r.price + " de oro"}</span></button>`).join("")}</div>
      <h3>BORRAR UNA REGLA</h3>
      <div class="row">${S.rules.length ? S.rules.map(id => `<button data-x="${id}" ${removed ? "disabled" : ""}>${RULE[id].icon} ${RULE[id].name}</button>`).join("") : "<p>No tienes reglas activas.</p>"}</div>
      <button class="go" id="goBtn">Seguir subiendo</button>`;
    ov.querySelectorAll("[data-r]").forEach(b => b.onclick = () => { const r = offer[+b.dataset.r]; if (S.coins >= r.price && !r.sold) { S.coins -= r.price; r.sold = true; gainRelic(r.id); updateHud(true); render(); } });
    ov.querySelectorAll("[data-x]").forEach(b => b.onclick = () => { S.rules = S.rules.filter(x => x !== b.dataset.x); removed = true; updateHud(true); render(); });

  };
  render();
}

const $ = id => document.getElementById(id);
let lastHud = "";
function updateHud(force) {
  const key = [S.floor, S.hp, S.maxhp, S.coins, S.carry, S.rules.join(), S.relics.join()].join("|");
  if (key === lastHud && !force) return; lastHud = key;
  $("hFloor").textContent = S.floor;
  $("hHearts").textContent = "♥".repeat(Math.max(0, S.hp)) + "♡".repeat(Math.max(0, S.maxhp - Math.max(0, S.hp)));
  $("hCoins").textContent = S.coins;
  $("hCarry").textContent = S.carry ? " +" + S.carry : "";
  $("hCap").textContent = S.rules.length + "/" + cap(S.floor);
  $("hRules").innerHTML = (S.rules.map(id => `<span class="chip"><span class="ic">${RULE[id].icon}</span>${RULE[id].name}</span>`).join("") || '<span class="chip">Sin reglas</span>')
    + activeCombos().map(c => `<span class="chip combo">${c.name}</span>`).join("")
    + S.relics.map(id => `<span class="chip relic">${RELIC[id].name}</span>`).join("");
  document.querySelectorAll("#labrow button[data-id]").forEach(b => b.setAttribute("aria-pressed", has(b.dataset.id)));
  const frozen = has("frozen");
  $("tLeft").classList.toggle("off", frozen); $("tRight").classList.toggle("off", frozen);
  $("tJump").textContent = has("nojump") || frozen ? "Subir" : "Saltar";
  $("tAttack").textContent = has("noatk") ? "Empujar" : "Atacar";
}
function buildLab() {
  const row = $("labrow");
  if (row.childElementCount) return;
  row.innerHTML = RULES.map(r => `<button data-id="${r.id}" aria-pressed="false">${r.icon} ${r.name}</button>`).join("")
    + `<button id="labVert" aria-pressed="false">\u21E7 Sala ascendente</button><button id="labClimb" aria-pressed="false">\u2191 Piso vertical</button><button id="labGraph" aria-pressed="false">\u25C7 Ver algoritmo</button>`;
  $("labGraph").onclick = e => { showGraph = !showGraph; e.currentTarget.setAttribute("aria-pressed", showGraph); e.currentTarget.blur(); };
  $("labClimb").onclick = e => { forceClimb = !forceClimb; e.currentTarget.setAttribute("aria-pressed", forceClimb); toast(forceClimb ? "Todos los pisos serán verticales" : "Pisos verticales al azar"); if (forceClimb && S.mode === "play") startFloor(); e.currentTarget.blur(); };
  $("labVert").onclick = e => { forceVert = !forceVert; e.currentTarget.setAttribute("aria-pressed", forceVert); toast(forceVert ? "Todos los pisos serán salas ascendentes" : "Salas ascendentes solo al azar con Gravedad"); if (forceVert && S.mode === "play") startFloor(); e.currentTarget.blur(); };
  row.querySelectorAll("button[data-id]").forEach(b => b.onclick = () => {
    const id = b.dataset.id;
    if (has(id)) S.rules = S.rules.filter(r => r !== id); else S.rules.push(id);
    if (id === "nojump") toast("Cambia el generador al siguiente piso");
    updateHud(true); b.blur();
  });
}

    }

      ctx.fillStyle = white ? "#fff" : "#4f8a5a"; ctx.fillRect(e.x, e.y + 4, e.w, e.h - 4);
      ctx.fillStyle = white ? "#fff" : "#3a6a44"; ctx.beginPath(); ctx.moveTo(e.x - 2, e.y + 8); ctx.lineTo(e.x + 9, e.y - 2); ctx.lineTo(e.x + 20, e.y + 8); ctx.fill();
      ctx.fillStyle = e.tele > 0 ? "#f2c14e" : "#100e1a"; ctx.fillRect(e.x + 9 + e.face * 3, e.y + 8, 3, 3);
      ctx.strokeStyle = "#c9a36a"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(e.x + 9 + e.face * 10, e.y + 13, 8, e.face > 0 ? -1.3 : Math.PI - 1.3 + 0.6, e.face > 0 ? 1.3 : Math.PI + 1.3); ctx.stroke();
      ctx.globalAlpha = 1; continue;
    }
    if (e.type === "charger") {

      ctx.fillStyle = white || tele ? "#fff" : "#d0782e"; ctx.fillRect(e.x, e.y + 4, e.w, e.h - 4);
      ctx.fillStyle = "#8a4a1a"; ctx.fillRect(e.x + 4, e.y + 4, e.w - 8, 3);
      const hx = e.dir > 0 ? e.x + e.w : e.x - 6; ctx.fillStyle = "#ece8f5"; ctx.beginPath(); ctx.moveTo(hx, e.y + 6); ctx.lineTo(hx + 6 * (e.dir > 0 ? 1 : 0), e.y + 2); ctx.lineTo(hx + 6, e.y + 10); ctx.fill();
      if (e.st === "dazed") { ctx.fillStyle = "#f2c14e"; for (let k = 0; k < 3; k++) ctx.fillRect(e.x + 13 + Math.cos(S.t * 6 + k * 2) * 10, e.y - 6 + Math.sin(S.t * 6 + k * 2) * 3, 3, 3); }
      ctx.globalAlpha = 1; continue;
    }
    if (e.type === "spider") {
      ctx.strokeStyle = "rgba(220,220,235,.5)"; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(e.x + 9, e.anchor - 4); ctx.lineTo(e.x + 9, e.y); ctx.stroke();
      ctx.strokeStyle = white ? "#fff" : "#2a2238"; ctx.lineWidth = 2;
      for (let k = 0; k < 4; k++) { const ly = e.y + 3 + k * 3, wig = Math.sin(S.t * 10 + k) * 2; ctx.beginPath(); ctx.moveTo(e.x - 4, ly + wig); ctx.lineTo(e.x + 18 + 4, ly - wig); ctx.stroke(); }
      ctx.fillStyle = white ? "#fff" : "#3a2f52"; ctx.beginPath(); ctx.arc(e.x + 9, e.y + 7, 7, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#e0566b"; ctx.fillRect(e.x + 5, e.y + 6, 2, 2); ctx.fillRect(e.x + 11, e.y + 6, 2, 2);

      const gr = ctx.createRadialGradient(e.x + 8, e.y + 8, 1, e.x + 8, e.y + 8, 14); gr.addColorStop(0, white ? "#fff" : "#bff6ff"); gr.addColorStop(1, "rgba(95,209,196,0)");
      ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(e.x + 8, e.y + 8, 14, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#100e1a"; ctx.fillRect(e.x + 5, e.y + 6, 2, 3); ctx.fillRect(e.x + 10, e.y + 6, 2, 3);

  if (S.ghost) {

  if (S.swapTarget && !S.swapTarget.dead && has("swap")) {

  ctx.restore();

    const top = S.gdir > 0 ? CH - S.tide : 0;
    ctx.fillStyle = has("dark") ? "rgba(20,40,70,.55)" : "rgba(60,140,210,.32)"; ctx.fillRect(0, top, CW, S.tide);
    ctx.fillStyle = "rgba(140,200,255,.6)"; ctx.fillRect(0, S.gdir > 0 ? top : S.tide - 2, CW, 2);

    dctx.globalCompositeOperation = "source-over"; dctx.clearRect(0, 0, CW, CH);

    const hole = (x, y, r) => { const gr = dctx.createRadialGradient(x, y, r * 0.3, x, y, r); gr.addColorStop(0, "rgba(0,0,0,1)"); gr.addColorStop(1, "rgba(0,0,0,0)"); dctx.fillStyle = gr; dctx.beginPath(); dctx.arc(x, y, r, 0, Math.PI * 2); dctx.fill(); };

  let hy = 18;
  if (has("timer")) { ctx.fillStyle = S.timeLeft < 10 ? "#e0566b" : "#ece8f5"; ctx.fillText("TIEMPO " + Math.ceil(S.timeLeft), 34, hy); hy += 16; }
  if (has("grav") && S.mode === "play") {
    const warn = S.gt < gravWarn();
    ctx.fillStyle = warn ? "#f2c14e" : "#9a94b8"; ctx.fillText("GRAVEDAD " + Math.ceil(S.gt) + "s", 34, hy); hy += 16;
    if (warn && Math.floor(S.t * 8) % 2) { ctx.strokeStyle = "#f2c14e"; ctx.lineWidth = 6; ctx.strokeRect(3, 3, CW - 6, CH - 6); ctx.fillStyle = "#f2c14e"; ctx.font = "40px Silkscreen, monospace"; ctx.textAlign = "center"; ctx.fillText(S.gdir > 0 ? "↑" : "↓", CW / 2, CH / 2); ctx.font = "12px Silkscreen, monospace"; ctx.textAlign = "left"; }
  }

/* ---------- slingshot (Inmóvil) ---------- */
let drag = null;
function dragVec() {
  if (!drag) return null;
  const r = cv.getBoundingClientRect(), k = CW / r.width;
  let vx = (drag.sx - drag.x) * k * 4.2, vy = (drag.sy - drag.y) * k * 4.2;
  const m = Math.hypot(vx, vy), max = rel("muelle") ? 860 : 680;
  if (m < 60) return null;
  if (m > max) { vx *= max / m; vy *= max / m; }
  return { vx, vy };
}
function toWorld(e) { const r = cv.getBoundingClientRect(), k = CW / r.width; return { x: (e.clientX - r.left) * k + S.camX, y: (e.clientY - r.top) * k + (S.camY || 0) }; }
cv.addEventListener("pointerdown", e => {
  if (!S || S.mode !== "play") return;
  if (!has("frozen")) { aimAt = toWorld(e); pressed.attack = true; e.preventDefault(); return; }
  drag = { sx: e.clientX, sy: e.clientY, x: e.clientX, y: e.clientY, id: e.pointerId };
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  e.preventDefault();
});
cv.addEventListener("pointermove", e => { if (drag && e.pointerId === drag.id) { drag.x = e.clientX; drag.y = e.clientY; } });
const endDrag = e => {
  if (!drag || e.pointerId !== drag.id) return;
  const v = dragVec(), p = S.player; drag = null;
  if (S.mode !== "play") return;
  if (!v) { aimAt = toWorld(e); pressed.attack = true; return; }
  const can = p.ground || p.climb || (rel("muelle") && !p.airLaunch);
  if (!can) { toast("Solo puedes lanzarte desde el suelo"); return; }
  if (!p.ground && !p.climb) p.airLaunch = true;
  p.vx = v.vx; p.vy = v.vy; p.climb = false; p.ground = false; p.launchT = 0.12;
  if (Math.abs(v.vx) > 10) p.face = Math.sign(v.vx);
  puff(p.x + p.w / 2, p.y + p.h, 6); noise(p.x, p.y);
};
cv.addEventListener("pointerup", endDrag); cv.addEventListener("pointercancel", e => { if (drag && e.pointerId === drag.id) drag = null; });

/* ---------- input ---------- */
const KEYS = { ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right", Space: "jump", KeyZ: "jump", KeyW: "up", ArrowUp: "up",
  KeyJ: "attack", KeyX: "attack", KeyK: "attack", KeyS: "down", ArrowDown: "down" };
addEventListener("keydown", e => {
  if (e.target && e.target.tagName === "BUTTON" && (e.code === "Space" || e.code === "Enter") && S.mode !== "play") return;
  if (S.mode === "menu" && S.cardPick && (e.code === "Digit1" || e.code === "Digit2")) {
    const i = +e.code.slice(-1) - 1; if (S.cardPick.pick[i]) choose(S.cardPick.pick, i, S.cardPick.hard); e.preventDefault(); return;
  }
  if ((S.mode === "title" || S.mode === "dead") && e.code === "Enter") { $("goBtn")?.click(); e.preventDefault(); return; }
  if (e.code === "KeyR" && S.mode === "play") { newRun({ char: S.char.id, daily: S.daily }); nextRuleStep(); return; }
  const k = KEYS[e.code]; if (!k) return;
  if (S.mode === "play") e.preventDefault();
  if (!input[k] && k in pressed) pressed[k] = true;
  input[k] = true;
});
addEventListener("keyup", e => { const k = KEYS[e.code]; if (k) input[k] = false; });
addEventListener("blur", () => { for (const k in input) input[k] = false; });

const touch = $("touch");
function enableTouch() { touch.classList.add("on"); }
if (matchMedia("(pointer: coarse)").matches) enableTouch();
addEventListener("touchstart", enableTouch, { once: true, passive: true });
touch.querySelectorAll(".tb").forEach(b => {
  const k = b.dataset.k;
  const down = e => { e.preventDefault(); e.stopPropagation(); try { b.setPointerCapture(e.pointerId); } catch (_) {} if (!input[k] && k in pressed) pressed[k] = true; input[k] = true; b.classList.add("held"); };
  const up = e => { e.preventDefault(); input[k] = false; b.classList.remove("held"); };
  b.addEventListener("pointerdown", down);
  b.addEventListener("pointerup", up); b.addEventListener("pointercancel", up); b.addEventListener("lostpointercapture", up);
  b.addEventListener("contextmenu", e => e.preventDefault());
});

/* ---------- loop ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt / 2);
  pressed.jump = false; pressed.attack = false;
  update(dt / 2);
  draw();
  requestAnimationFrame(frame);
}
newRun();
buildLab();
showTitle();
requestAnimationFrame(frame);
window.__omf = { analyzeFloor, reachGraph, buildFloor, get S() { return S; }, input, pressed, applyRule, startFloor, RULES, setVert: v => { forceVert = v; }, setClimb: v => { forceClimb = v; } };
})();
</script>
